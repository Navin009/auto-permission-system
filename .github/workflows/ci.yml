name: CI

# Not run on push to main: work lands on main directly, and release-tag.yml runs
# typecheck and tests itself before creating a Release. This workflow guards
# pull requests and can also be started by hand.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm install

      - run: npm run typecheck

  format:
    # The formatter owns indentation, quotes and trailing commas. A red check
    # means someone hand-edited around it, not that the code is wrong.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm install

      - run: npm run format:check

  test:
    # Layer 2 unit tests assume POSIX paths and real symlink support, so
    # they must run on Linux/macOS, not Windows. `npm run check` is the same
    # gate a maintainer runs locally: typecheck, every test file, then the
    # manifest suite plus the SECURITY.md render.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm install

      - run: npm run check
