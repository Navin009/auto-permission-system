name: CI

# Not run on push to main: work lands on main directly, and release-tag.yml runs
# typecheck and tests itself before creating a Release. This workflow guards
# pull requests and can also be started by hand.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm ci

      - run: npm run typecheck

  format:
    # The formatter owns indentation, quotes and trailing commas. A red check
    # means someone hand-edited around it, not that the code is wrong.
    runs-on: ubuntu-latest
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm ci

      - run: npm run format:check

      # A moving tag can be repointed by whoever owns the action repository.
      - name: Check action pins
        run: |
          if grep -rnE 'uses: [^ ]+@v[0-9]' .github/workflows; then
            echo "::error::pin every action to a full commit SHA"
            exit 1
          fi

      # One specifier style: a relative import names the .ts file it loads.
      - name: Check import specifiers
        run: |
          if grep -rnE 'from "\.\.?/[^"]*"' src extensions | grep -vE '\.ts";?$'; then
            echo "::error::a relative import must end in .ts"
            exit 1
          fi

  test:
    # Layer 2 unit tests assume POSIX paths and real symlink support, so
    # they must run on Linux/macOS, not Windows. `npm run check` is the same
    # gate a maintainer runs locally: typecheck, every test file, then the
    # manifest suite plus the SECURITY.md render.
    runs-on: ubuntu-latest
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm ci

      - run: npm run check
