name: Release

# Release when the commit message says "release". Any push to main whose head
# commit contains that word runs semantic-release, which bumps the version from
# the Conventional Commit types, writes CHANGELOG.md, commits the bump, tags
# vX.Y.Z and publishes the GitHub Release. Every other push is skipped at the
# job level, before a runner starts.
#
#   git commit -m "fix(guard): handle X release"    # commits and releases
#   git commit -m "feat(tool-view): add Y release"  # minor bump
#   git commit -m "refactor(guard): split parser"   # commits only
#
# The bump size still comes from the commit type (fix: patch, feat: minor,
# feat!: major) of everything since the last tag. A docs:/chore: commit that
# mentions release runs the job and releases nothing.
#
# semantic-release's own commit `chore(release): x.y.z [skip ci]` contains the
# word too, so the job condition excludes it: no release loop.
#
# Publishing uses npm Trusted Publishing (OIDC) — no NPM_TOKEN secret needed.
# Configure the trusted publisher once at:
#   https://www.npmjs.com/package/auto-permission-system/access
#   -> Trusted Publisher
#   Provider: GitHub Actions, Repo: Navin009/auto-permission-system,
#   Workflow filename: release.yml
# Requires npm CLI >= 11.5.1 and Node >= 22.14, hence the explicit npm upgrade
# step below. Pinned to node-version 24 to match ci.yml.
#
# The job runs typecheck and tests itself before semantic-release, so a red main
# releases nothing. ci.yml does not run on push to main.

on:
  push:
    branches: [main]

permissions:
  contents: write   # to push the release commit/tag and create the GH release
  issues: write      # semantic-release comments on related issues
  pull-requests: write
  id-token: write    # required for OIDC trusted publishing + npm provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      contains(github.event.head_commit.message, 'release')
      && !startsWith(github.event.head_commit.message, 'chore(release)')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0   # semantic-release needs full history/tags
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # no `cache` input set — default is no caching (release builds
          # should never cache); do NOT set `cache: false`, setup-node
          # rejects the boolean and errors:
          # "Caching for 'false' is not supported"

      # ensure npm >= 11.5.1 for trusted publishing
      - run: npm install -g npm@latest

      - run: npm install

      - run: npm run typecheck

      - run: npm test

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # npm publishing is opt-in. It stays off until the package has a
          # Trusted Publisher set up (npmjs.com → package → Settings → Trusted
          # Publisher: GitHub Actions, repo Navin009/auto-permission-system,
          # workflow release.yml). To enable, set repository variable
          # NPM_PUBLISH=true (Settings → Secrets and variables → Actions →
          # Variables). Until then the run still creates the GitHub Release.
          NPM_PUBLISH: ${{ vars.NPM_PUBLISH }}
        run: npx semantic-release
